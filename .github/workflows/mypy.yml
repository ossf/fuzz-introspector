name: Mypy

on:
  pull_request:
    paths:
      - 'src/**'
      - 'frontends/python/**'
      - 'oss_fuzz_integration/**'
      - '.github/workflows/mypy.yml'
permissions: read-all
jobs:
  build:
    runs-on: ubuntu-latest
    name: Mypy
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v2.4.0
    - name: Set up Python 3.10
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v3.0.0
      with:
        python-version: "3.10"
    - name: Install Dependencies
      run: |
        pip install mypy types-PyYAML
    - name: Install FI as modules
      run: |
        cd src && pip install .
    - name: mypy
      run: |
        cd src && mypy --ignore-missing-imports -m main
