name: Mypy

on:
  pull_request:
    paths:
      - 'src/**'
      - 'frontends/python/**'
      - 'oss_fuzz_integration/**'
      - '.github/workflows/mypy.yml'
permissions: read-all
jobs:
  build:
    runs-on: ubuntu-latest
    name: Mypy
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v2.4.0
    - name: Set up Python 3.10
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v3.0.0
      with:
        python-version: "3.10"
    - name: Install Dependencies
      run: |
        pip install mypy types-PyYAML
    - name: Install FI as modules
      run: |
        cd src && pip install .
    - name: mypy
      run: |
        cd src && mypy --ignore-missing-imports -m main
